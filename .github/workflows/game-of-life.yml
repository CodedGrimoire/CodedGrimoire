name: Contribution Game of Life

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate Game of Life SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/game-of-life.svg

      - name: Deploy with git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Save generated file
          mkdir -p temp_output
          cp dist/game-of-life.svg temp_output/github-contribution-grid-snake.svg

          # Switch to orphan output branch
          git checkout --orphan output

          # Remove all files from branch
          git rm -rf . || true

          # Move file back
          mkdir -p .
          cp temp_output/github-contribution-grid-snake.svg .

          # Commit and push
          git add github-contribution-grid-snake.svg
          git commit -m "Update contribution animation"
          git push origin output --force
